      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="model-toggle" onclick="toggleModelDetail('${m.id}')">▸ Details</button>
        ${tar ? `<button class="model-toggle" onclick="viewArtifact('${tar.id}')">View Training Authorization</button>` : ''}
        ${m.status === 'evaluation' ? `<button class="model-toggle" onclick="advanceModelStatus('${m.id}','deployed')">Mark Deployed</button>` : ''}
        ${m.status === 'authorized' ? `<button class="model-toggle" onclick="advanceModelStatus('${m.id}','training')">Begin Training</button>` : ''}
        ${m.status === 'training' ? `<button class="model-toggle" onclick="advanceModelStatus('${m.id}','evaluation')">Move to Evaluation</button>` : ''}
        ${m.status !== 'retired' ? `<button class="model-toggle" onclick="advanceModelStatus('${m.id}','retired')">Retire</button>` : ''}
      </div>
      <div class="model-detail" id="model-detail-${m.id}">
        <div class="detail-grid">
          <div class="span-2"><div class="detail-field-label">Post-Termination Plan</div><div class="detail-field-value">${esc(m.post_termination_plan)}</div></div>
          <div><div class="detail-field-label">Created</div><div class="detail-field-value mono">${fmtDateTime(m.created_at)}</div></div>
          <div><div class="detail-field-label">Deployed</div><div class="detail-field-value mono">${m.deployed_at ? fmtDateTime(m.deployed_at) : '—'}</div></div>
        </div>
        ${tar ? renderTrainingArtifact(tar) : ''}
      </div>
    </div>`;
}

function toggleModelDetail(id) {
  $(`#model-detail-${id}`)?.classList.toggle('open');
}

function advanceModelStatus(id, newStatus) {
  const m = state.models.find(x => x.id === id);
  const old = m.status;
  m.status = newStatus;
  if (newStatus === 'deployed') m.deployed_at = new Date().toISOString();
  if (newStatus === 'retired') m.retired_at = new Date().toISOString();
  persist(STORAGE_KEYS.models, state.models);
  const ds = state.datasets.find(d => d.id === m.linked_soe_ids[0]);
  logEvent({ timestamp: new Date().toISOString(), soe_id: m.linked_soe_ids[0], dataset_name: ds?.dataset_name || '', layer: 'ai_sandbox', event_type: 'model_status_changed', actor_name: 'Sam Chen', actor_role: 'AI System Operator', description: `Model ${m.id} status: ${old} → ${newStatus}.`, artifact_id: m.id, metadata: { old, new: newStatus } });
  renderAll();
  toast(`${m.id} → ${newStatus}`);
}
</script>

<script>
// ===================================================================
// AUDIT LOG
// ===================================================================
function renderAudit() {
  const html = `
    <div class="view-header">
      <div>
        <div class="view-title">Audit Log</div>
        <div class="view-subtitle">Cross-service event timeline · ${state.events.length} total events</div>
      </div>
      <div class="view-toggle">
        <button class="${state.auditMode === 'timeline' ? 'active' : ''}" onclick="setAuditMode('timeline')">Timeline</button>
        <button class="${state.auditMode === 'artifacts' ? 'active' : ''}" onclick="setAuditMode('artifacts')">Artifacts</button>
      </div>
    </div>
    ${state.auditMode === 'timeline' ? renderAuditTimeline() : renderAuditArtifacts()}
  `;
  $('#view-audit').innerHTML = html;
}

function setAuditMode(mode) { state.auditMode = mode; renderAudit(); }

function renderAuditTimeline() {
  const f = state.auditFilters;
  let events = state.events.slice();
  if (f.dataset !== 'all') events = events.filter(e => e.soe_id === f.dataset);
  if (f.layer !== 'all') events = events.filter(e => e.layer === f.layer);
  if (f.event !== 'all') events = events.filter(e => e.event_type === f.event);

  const eventTypes = [...new Set(state.events.map(e => e.event_type))];
  const totalToday = state.events.filter(e => new Date(e.timestamp).toDateString() === new Date().toDateString()).length;
  const byLayer = {};
  state.events.forEach(e => { byLayer[e.layer] = (byLayer[e.layer] || 0) + 1; });
  const mostActive = state.datasets.map(d => ({ id: d.id, name: d.dataset_name, count: state.events.filter(e => e.soe_id === d.id).length })).sort((a, b) => b.count - a.count)[0];

  return `
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">Dataset</span>
        <select class="search-box" style="max-width:220px;" onchange="setAuditFilter('dataset', this.value)">
          <option value="all">All datasets</option>
          ${state.datasets.map(d => `<option value="${d.id}" ${f.dataset === d.id ? 'selected' : ''}>${d.id} — ${esc(d.dataset_name.slice(0, 40))}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Layer</span>
        ${['all','agency_facing','control_plane','data_plane','ai_sandbox','system'].map(l => `<span class="filter-chip ${f.layer === l ? 'active' : ''}" onclick="setAuditFilter('layer','${l}')">${l === 'all' ? 'All' : layerLabel(l)}</span>`).join('')}
      </div>
      <div class="filter-group">
        <span class="filter-label">Event</span>
        <select class="search-box" style="max-width:200px;" onchange="setAuditFilter('event', this.value)">
          <option value="all">All event types</option>
          ${eventTypes.map(t => `<option value="${t}" ${f.event === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="two-col" style="grid-template-columns: 2.2fr 1fr;">
      <div>
        <div class="card">
          <div class="card-header"><span class="card-title">Timeline</span><span class="card-meta">${events.length} events${events.length !== state.events.length ? ` (filtered from ${state.events.length})` : ''}</span></div>
          <div class="activity-feed">
            ${events.length === 0 ? '<div style="color:var(--text-secondary);font-size:13px;padding:16px;">No events match the current filters.</div>' : events.slice(0, 200).map(e => `
              <div class="activity-entry">
                <span class="activity-layer ${e.layer}">${layerLabel(e.layer)}</span>
                <div class="activity-body">
                  <div class="activity-desc">${esc(e.description)}</div>
                  <div class="activity-meta">
                    <span class="mono" style="font-family:var(--mono);">${esc(e.soe_id)}</span>
                    <span>·</span>
                    <span>${esc(e.actor_name)}</span>
                    <span>·</span>
                    <span>${esc(e.actor_role)}</span>
                    ${e.artifact_id ? `<span>·</span><a href="#" onclick="viewArtifact('${e.artifact_id}');return false;" style="font-family:var(--mono);font-size:11px;">${e.artifact_id}</a>` : ''}
                    <span class="activity-time" title="${fmtDateTime(e.timestamp)}">${relTime(e.timestamp)}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          ${events.length > 200 ? `<div style="font-size:12px;color:var(--text-secondary);text-align:center;padding:8px;">Showing 200 of ${events.length}.</div>` : ''}
        </div>
      </div>
      <div>
        <div class="side-card">
          <div class="side-title">Summary</div>
          <div class="stat-list">
            <div class="stat-row"><span class="label">Total Events</span><span class="value blue">${state.events.length}</span></div>
            <div class="stat-row"><span class="label">Today</span><span class="value">${totalToday}</span></div>
            <div class="stat-row"><span class="label">Last Event</span><span class="value muted">${state.events[0] ? relTime(state.events[0].timestamp) : '—'}</span></div>
          </div>
        </div>
        <div class="side-card">
          <div class="side-title">Events by Layer</div>
          <div class="stat-list">
            ${['agency_facing','control_plane','data_plane','ai_sandbox','system'].map(l => `<div class="stat-row"><span class="label"><span class="activity-layer ${l}" style="font-size:8px;padding:2px 5px;">${layerLabel(l)}</span></span><span class="value">${byLayer[l] || 0}</span></div>`).join('')}
          </div>
        </div>
        <div class="side-card">
          <div class="side-title">Most Active Dataset</div>
          ${mostActive && mostActive.count > 0 ? `<div style="font-size:12px;"><span class="mono" style="font-family:var(--mono);">${mostActive.id}</span><br><span style="color:var(--text-secondary);">${esc(mostActive.name)}</span><br><strong>${mostActive.count}</strong> events</div>` : '<div style="font-size:12px;color:var(--text-secondary);">—</div>'}
        </div>
      </div>
    </div>
  `;
}

function setAuditFilter(key, value) {
  state.auditFilters[key] = value;
  renderAudit();
}

function renderAuditArtifacts() {
  if (state.datasets.length === 0) return '<div class="card"><div style="text-align:center;padding:32px;color:var(--text-secondary);">No datasets yet.</div></div>';
  if (!state.selectedDatasetId || !state.datasets.find(d => d.id === state.selectedDatasetId)) state.selectedDatasetId = state.datasets[0].id;
  const ds = state.datasets.find(d => d.id === state.selectedDatasetId);

  const tabs = [
    { id: 'presig', label: 'Pre-Signature Change Log' },
    { id: 'amendments', label: 'Post-Execution Amendments' },
    { id: 'custody', label: 'Chain of Custody' },
    { id: 'classification', label: 'Classification Thread' },
    { id: 'validation', label: 'Validation Report' },
    { id: 'transform', label: 'Transformation Log' },
    { id: 'training', label: 'Training Authorization' }
  ];

  return `
    <div class="filter-bar">
      <span class="filter-label">Dataset</span>
      <select class="search-box" style="max-width:340px;" onchange="setArtifactsDataset(this.value)">
        ${state.datasets.map(d => `<option value="${d.id}" ${d.id === ds.id ? 'selected' : ''}>${d.id} — ${esc(d.dataset_name)}</option>`).join('')}
      </select>
      ${tierBadge(ds.tier)}
    </div>

    <div class="sub-tabs">
      ${tabs.map(t => `<button class="sub-tab ${state.artifactTab === t.id ? 'active' : ''}" onclick="setArtifactTab('${t.id}')">${t.label}</button>`).join('')}
    </div>

    ${renderArtifactTab(ds)}
  `;
}

function setArtifactsDataset(id) { state.selectedDatasetId = id; renderAudit(); }
function setArtifactTab(tab) { state.artifactTab = tab; renderAudit(); }

function renderArtifactTab(ds) {
  const tab = state.artifactTab;
  if (tab === 'presig') return renderPresigArtifactTab(ds);
  if (tab === 'amendments') return renderAmendmentsArtifactTab(ds);
  if (tab === 'custody') return renderCustodyArtifactTab(ds);
  if (tab === 'classification') return renderClassificationArtifactTab(ds);
  if (tab === 'validation') return renderValidationArtifactTab(ds);
  if (tab === 'transform') return renderTransformArtifactTab(ds);
  if (tab === 'training') return renderTrainingArtifactTab(ds);
  return '';
}

function sideCardSummary(title, rows) {
  return `<div class="side-card"><div class="side-title">${title}</div><div class="stat-list">${rows.map(([l, v, cls]) => `<div class="stat-row"><span class="label">${l}</span><span class="value ${cls || ''}">${v}</span></div>`).join('')}</div></div>`;
}

function renderPresigArtifactTab(ds) {
  const edits = state.edits.filter(e => e.soe_id === ds.id).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  const agency = edits.filter(e => e.author_party === 'agency').length;
  const bfi = edits.filter(e => e.author_party === 'bfi').length;
  const sys = edits.filter(e => e.author_party === 'system').length;
  const sections = new Set(edits.map(e => e.section_number)).size;
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        <div class="card">
          <div class="card-header"><span class="card-title">Negotiation History — Pre-Signature Edits</span><span class="card-meta">Newest → oldest</span></div>
          ${edits.length === 0 ? '<div style="padding:12px 0;color:var(--text-secondary);font-size:13px;">No pre-signature edits recorded.</div>' : edits.map(e => `
            <div class="changelog-entry ${e.author_party}">
              <div class="entry-header">
                <span class="entry-author">${esc(e.author_name)}</span>
                <span class="entry-role ${e.author_party}">${esc(e.author_party === 'bfi' ? 'BFI · ' : e.author_party === 'agency' ? 'Agency · ' : '')}${esc(e.author_role)}</span>
                <span class="entry-timestamp">${fmtDateTime(e.timestamp)}</span>
              </div>
              <div class="entry-section">${esc(e.section_title)}</div>
              <div class="entry-body">${esc(e.rationale || '')}</div>
              ${e.old_text !== '—' ? `<div class="entry-diff"><span class="diff-old">${esc(e.old_text)}</span> → <span class="diff-new">${esc(e.new_text)}</span></div>` : ''}
            </div>`).join('')}
        </div>
      </div>
      <div>
        ${sideCardSummary('Summary', [['Total edits', edits.length, 'blue'], ['Agency', agency, 'amber'], ['BFI', bfi, 'blue'], ['System', sys], ['Sections touched', sections]])}
      </div>
    </div>`;
}

function renderAmendmentsArtifactTab(ds) {
  const amends = state.amendments.filter(a => a.soe_id === ds.id).sort((a,b) => b.amendment_number - a.amendment_number);
  const exec = amends.filter(a => a.status === 'executed').length;
  const pending = amends.filter(a => a.status === 'pending').length;
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        ${amends.length === 0 ? '<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">No amendments filed.</div></div>' : amends.map(a => `
          <div class="card" style="padding:0;">
            <div style="padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);">
              <div style="width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">${a.amendment_number}</div>
              <strong style="font-size:14px;flex:1;">${esc(a.title)}</strong>
              <span style="font-size:12px;color:var(--text-secondary);">${fmtDate(a.filed_date)}</span>
              <span class="badge badge-${a.status === 'executed' ? 'green' : 'amber'}">${esc(a.status)}</span>
            </div>
            <div style="padding:14px 16px;background:#fafbfc;">
              ${renderAmendmentArtifact(a)}
            </div>
          </div>
        `).join('')}
      </div>
      <div>
        ${sideCardSummary('Summary', [['Total', amends.length, 'blue'], ['Executed', exec, 'green'], ['Pending', pending, 'amber']])}
      </div>
    </div>`;
}

function renderCustodyArtifactTab(ds) {
  const receipts = state.receipts.filter(r => r.soe_id === ds.id).sort((a,b) => new Date(b.upload_timestamp) - new Date(a.upload_timestamp));
  const totalRecs = receipts.reduce((s, r) => s + (r.record_count || 0), 0);
  const totalBytes = receipts.reduce((s, r) => s + (r.file_size_bytes || 0), 0);
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        ${receipts.length === 0 ? '<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">No custody receipts yet.</div></div>' : receipts.map(r => renderReceiptArtifact(r)).join('')}
      </div>
      <div>
        ${sideCardSummary('Summary', [['Total transfers', receipts.length, 'blue'], ['Verified', receipts.filter(r => r.status === 'verified').length, 'green'], ['Total volume', fmtBytes(totalBytes)], ['Total records', fmtNumber(totalRecs)], ['Latest', receipts[0] ? relTime(receipts[0].upload_timestamp) : '—']])}
      </div>
    </div>`;
}

function renderClassificationArtifactTab(ds) {
  const thread = state.classification.find(t => t.soe_id === ds.id);
  if (!thread) return '<div class="card"><div style="text-align:center;padding:16px;color:var(--text-secondary);">No classification thread.</div></div>';
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        <div class="card">
          <div class="card-header"><span class="card-title">Classification Discussion Thread</span><span class="card-meta">${thread.resolved_at ? 'Resolved · Tier ' + thread.final_tier : 'Open'}</span></div>
          <div class="thread-container">${thread.messages.map(renderThreadMessage).join('')}</div>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><button class="btn btn-secondary btn-sm" onclick="openClassificationModal('${ds.id}')">Open in full view →</button></div>
        </div>
      </div>
      <div>
        ${sideCardSummary('Summary', [['Suggested', 'Tier ' + thread.auto_suggested_tier, 'blue'], ['Final', 'Tier ' + (thread.final_tier || '—'), 'green'], ['Agency Override', thread.agency_override ? 'Yes' : 'No', thread.agency_override ? 'amber' : ''], ['Messages', thread.messages.length], ['Resolved', thread.resolved_at ? fmtDate(thread.resolved_at) : 'Open', 'muted']])}
      </div>
    </div>`;
}

function renderValidationArtifactTab(ds) {
  const reports = state.validation.filter(v => v.soe_id === ds.id);
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        ${reports.length === 0 ? '<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">No validation reports yet.</div></div>' : reports.map(v => `<div class="card">${renderValidationArtifact(v)}</div>`).join('')}
      </div>
      <div>
        ${sideCardSummary('Summary', [['Reports', reports.length, 'blue'], ['Accepted', reports.filter(r => r.outcome === 'accepted').length, 'green'], ['Latest', reports[0] ? fmtDate(reports[0].created_at) : '—', 'muted']])}
      </div>
    </div>`;
}

function renderTransformArtifactTab(ds) {
  const ops = state.transformation.filter(o => o.soe_id === ds.id).sort((a,b) => a.sequence - b.sequence);
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        <div class="card">
          <div class="card-header"><span class="card-title">Transformation Log</span><span class="card-meta">${ops.length} operations</span></div>
          ${ops.length === 0 ? '<div style="padding:12px 0;color:var(--text-secondary);font-size:13px;">No transformations yet.</div>' : renderTransformationArtifact({ __ops: ops, soe_id: ds.id })}
        </div>
      </div>
      <div>
        ${sideCardSummary('Summary', [['Operations', ops.length, 'blue'], ['Reversible', ops.filter(o => o.reversible).length, 'green'], ['Non-reversible', ops.filter(o => !o.reversible).length, 'amber']])}
      </div>
    </div>`;
}

function renderTrainingArtifactTab(ds) {
  const tars = state.training.filter(t => t.soe_id === ds.id);
  return `
    <div class="two-col" style="grid-template-columns:1fr 280px;">
      <div>
        ${tars.length === 0 ? '<div class="card"><div style="text-align:center;color:var(--text-secondary);padding:16px;">No training authorizations for this dataset.</div></div>' : tars.map(t => `<div class="card">${renderTrainingArtifact(t)}</div>`).join('')}
      </div>
      <div>
        ${sideCardSummary('Summary', [['TARs', tars.length, 'blue'], ['Status', tars[0]?.status || '—'], ['AI/ML authorized', ds.ai_ml_authorized ? 'Yes' : 'No', ds.ai_ml_authorized ? 'green' : 'amber']])}
      </div>
    </div>`;
}
</script>

<script>
// ===================================================================
// BOOT
// ===================================================================
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') reloadFromStorage();
});
window.addEventListener('storage', (e) => {
  if (Object.values(STORAGE_KEYS).includes(e.key)) reloadFromStorage();
});

(function boot() {
  seedDemoIfNeeded();
  loadState();
  renderAll();
})();
</script>

</body>
</html>
