    artifact_name: 'Storage Controls Confirmation',
    artifact_type: 'storage',
    signoffs: ['BFI Data Steward']
  },
  access: {
    description: 'Authorized Users list finalized. Access requests logged. For Tier 3, per-access disclosure log entries required.',
    artifact_name: 'Authorized User List + Access Log',
    artifact_type: 'access',
    signoffs: ['BFI Data Steward']
  },
  model_training: {
    description: 'AI/ML training authorization approved. Dataset released to isolated AI Sandbox under documented provenance and memorization safeguards.',
    artifact_name: 'Training Authorization Record',
    artifact_type: 'training',
    signoffs: ['BFI Data Steward', 'AI System Operator']
  },
  deployment: {
    description: 'Model moves from evaluation to production. Deployment authorization + post-deployment monitoring plan required.',
    artifact_name: 'Deployment Authorization + Monitoring Plan',
    artifact_type: 'deployment',
    signoffs: ['BFI Data Steward', 'AI System Operator', 'BFI Executive Sponsor']
  }
};

const TIER_GATE_CONTROLS = {
  ingestion: {
    1: 'Presigned URL; BFI steward verifies hash.',
    2: 'Presigned URL with session logging; steward verifies.',
    3: '⚠ CONDITIONAL (Tier 3): MFA-authenticated SFTP session required; Information Security & Privacy Official countersigns custody receipt; disclosure log entry generated.'
  },
  validation: {
    1: 'Schema conformance check + steward sign-off.',
    2: 'Schema check + steward sign-off; access logging begins.',
    3: '⚠ CONDITIONAL (Tier 3): Full validation + undisclosed PII scan; reclassification trigger if previously-undeclared sensitive fields detected.'
  },
  storage: {
    1: 'Standard BFI systems with encryption at rest.',
    2: 'Encrypted at rest; removable media must be encrypted.',
    3: '⚠ CONDITIONAL (Tier 3): NIST 800-53 encryption controls; isolated storage enclave; full access audit logging.'
  },
  access: {
    1: 'BFI staff with operational need.',
    2: 'Named user list; separation of duties enforced.',
    3: '⚠ CONDITIONAL (Tier 3): Strict need-to-know; disclosure log entry required for every access.'
  },
  model_training: {
    1: 'Training provenance records maintained.',
    2: 'Training provenance + memorization testing required.',
    3: '⚠ CONDITIONAL (Tier 3): De-identification required; re-ID risk assessment; Information Security & Privacy Official sign-off mandatory.'
  }
};

function renderPipeline() {
  if (state.datasets.length === 0) {
    $('#view-pipeline').innerHTML = `
      <div class="view-header"><div><div class="view-title">Pipeline</div><div class="view-subtitle">Data Plane · lifecycle tracker</div></div></div>
      <div class="card"><div style="text-align:center;padding:32px;color:var(--text-secondary);">No datasets yet. Register one in the Agency Portal.</div></div>`;
    return;
  }
  if (!state.selectedPipelineDatasetId || !state.datasets.find(d => d.id === state.selectedPipelineDatasetId)) {
    state.selectedPipelineDatasetId = state.datasets[0].id;
  }
  const ds = state.datasets.find(d => d.id === state.selectedPipelineDatasetId);
  const currentIdx = stageIndex(ds.current_stage);
  const next = nextStage(ds.current_stage, ds.ai_ml_authorized);
  const isFinal = !next;
  const gate = STAGE_GATE_INFO[ds.current_stage];
  const tierGate = TIER_GATE_CONTROLS[ds.current_stage];

  const html = `
    <div class="view-header">
      <div>
        <div class="view-title">Pipeline</div>
        <div class="view-subtitle">Data Plane · interactive lifecycle tracker</div>
      </div>
    </div>

    <div class="pipeline-selector">
      <span class="filter-label">Dataset</span>
      <select onchange="selectPipelineDataset(this.value)">
        ${state.datasets.map(d => `<option value="${d.id}" ${d.id === ds.id ? 'selected' : ''}>${esc(d.id)} — ${esc(d.dataset_name)} · ${STAGE_LABEL[d.current_stage]}</option>`).join('')}
      </select>
    </div>

    <div class="pipeline-header">
      <span class="title">${esc(ds.dataset_name)}</span>
      <span class="sub">${ds.id}</span>
      ${tierBadge(ds.tier)}
      <span class="badge badge-${ds.current_stage === 'terminated' ? 'gray' : 'green'}">${ds.status}</span>
      ${ds.ai_ml_authorized ? '<span class="badge badge-purple">AI/ML Authorized</span>' : '<span class="badge badge-gray">AI/ML Not Authorized</span>'}
    </div>

    <div class="stage-tracker">
      <div class="stage-track">
        ${STAGE_ORDER.map((s, i) => {
          const phase = STAGE_PHASE[s];
          const completed = i < currentIdx;
          const current = i === currentIdx;
          const locked = (s === 'model_training' || s === 'deployment') && !ds.ai_ml_authorized;
          const cls = locked ? 'locked' : completed ? 'completed' : current ? 'current' : 'future phase-' + phase;
          let arrowHtml = '';
          if (i < STAGE_ORDER.length - 1) {
            // Arrow classes: completed (between two completed stages), entering (arrow into current), default (future)
            const nextIdx = i + 1;
            let arrowCls = '';
            if (nextIdx <= currentIdx) arrowCls = nextIdx === currentIdx ? 'entering' : 'completed';
            if (i < currentIdx && nextIdx < currentIdx) arrowCls = 'completed';
            if (nextIdx === currentIdx) arrowCls = 'entering';
            if (i >= currentIdx) arrowCls = '';
            arrowHtml = `<span class="stage-arrow ${arrowCls}" aria-hidden="true">→</span>`;
          }
          return `<div class="stage-node ${cls}" onclick="openStageArtifacts('${ds.id}', '${s}')"><span class="num">Stage ${i+1}</span><span class="name">${STAGE_LABEL[s]}</span></div>${arrowHtml}`;
        }).join('')}
      </div>
      <div class="stage-artifacts-row">
        ${STAGE_ORDER.map((s, i) => {
          const stageArtifactMap = {
            request: { name: 'Scope of Exchange', short: 'SOE' },
            ingestion: { name: 'Chain of Custody Receipt', short: 'Custody Receipt' },
            validation: { name: 'Validation Report', short: 'Validation Report' },
            cleaning: { name: 'Transformation Log', short: 'Transformation Log' },
            model_training: { name: 'Training Authorization Record', short: 'Training Auth (TAR)' }
          };
          const art = stageArtifactMap[s];
          let cellHtml;
          if (!art) {
            cellHtml = `<div class="artifact-cell artifact-empty"></div>`;
          } else {
            const completed = i < currentIdx;
            const current = i === currentIdx;
            const locked = s === 'model_training' && !ds.ai_ml_authorized;
            const h = ds.stage_history.find(x => x.to === s);
            const artifactId = h?.artifact_id;
            if (locked) {
              cellHtml = `<div class="artifact-cell"><div class="artifact-card locked" title="${esc(art.name)} — AI/ML not authorized">
                <div class="artifact-card-label">${esc(art.short)}</div>
                <div class="artifact-card-status">N/A</div>
              </div></div>`;
            } else if (completed && artifactId) {
              cellHtml = `<div class="artifact-cell"><div class="artifact-card produced" onclick="viewArtifact('${artifactId}')" title="View ${esc(art.name)}">
                <div class="artifact-card-label">${esc(art.short)}</div>
                <div class="artifact-card-status">✓ ${esc(artifactId)}</div>
              </div></div>`;
            } else if (current) {
              cellHtml = `<div class="artifact-cell"><div class="artifact-card in-progress" title="${esc(art.name)} — in progress">
                <div class="artifact-card-label">${esc(art.short)}</div>
                <div class="artifact-card-status">In progress</div>
              </div></div>`;
            } else {
              cellHtml = `<div class="artifact-cell"><div class="artifact-card pending" title="${esc(art.name)} — pending">
                <div class="artifact-card-label">${esc(art.short)}</div>
                <div class="artifact-card-status">Pending</div>
              </div></div>`;
            }
          }
          const spacer = (i < STAGE_ORDER.length - 1) ? '<span class="artifact-spacer" aria-hidden="true"></span>' : '';
          return cellHtml + spacer;
        }).join('')}
      </div>
    </div>

    <div class="stage-detail">
      <div class="stage-detail-head">
        <div>
          <div class="stage-detail-title">Current Stage: ${STAGE_LABEL[ds.current_stage]}</div>
          <div class="stage-detail-sub">${esc(gate?.description || '')}</div>
        </div>
        ${!isFinal && ds.current_stage !== 'terminated' ? `<button class="btn btn-primary" onclick="confirmAdvance('${ds.id}')">Advance to ${STAGE_LABEL[next]} →</button>` : (ds.ai_ml_authorized ? '<span class="badge badge-blue">Pipeline complete</span>' : '<span class="badge badge-gray">AI/ML stages skipped</span>')}
      </div>

      <div class="stage-detail-section">
        <div class="stage-detail-section-title">Governance Artifact</div>
        <div style="font-size:14px;"><strong>${esc(gate?.artifact_name || 'None')}</strong> will be generated when this stage is completed.</div>
        ${renderCurrentStageArtifactLink(ds)}
      </div>

      <div class="stage-detail-section">
        <div class="stage-detail-section-title">Required Sign-offs</div>
        <div style="font-size:13px;">${(gate?.signoffs || []).map(r => `<span class="badge badge-gray" style="margin-right:6px;">${esc(r)}</span>`).join('')}</div>
      </div>

      ${tierGate ? `
      <div class="stage-detail-section">
        <div class="stage-detail-section-title">Tier ${ds.tier} Controls at This Gate</div>
        <div class="callout ${ds.tier === 3 ? 'callout-danger' : ds.tier === 2 ? 'callout-warning' : 'callout-info'}">${esc(tierGate[ds.tier])}</div>
      </div>` : ''}

      <div class="stage-detail-section">
        <div class="stage-detail-section-title">Stage History</div>
        ${ds.stage_history.length === 0 ? '<div style="font-size:12px;color:var(--text-secondary);">No transitions yet.</div>' : ds.stage_history.slice().reverse().map(h => `
          <div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--border);">
            <span class="mono" style="font-family:var(--mono);color:var(--text-secondary);">${fmtDateTime(h.timestamp)}</span>
            <span>${h.from ? STAGE_LABEL[h.from] + ' → ' : ''}<strong>${STAGE_LABEL[h.to]}</strong></span>
            <span style="margin-left:auto;color:var(--text-secondary);">${esc(h.actor)}</span>
            ${h.artifact_id ? `<a href="#" onclick="viewArtifact('${h.artifact_id}');return false;" style="font-family:var(--mono);font-size:11px;">${h.artifact_id} →</a>` : ''}
          </div>`).join('')}
      </div>
    </div>
  `;
  $('#view-pipeline').innerHTML = html;
}

function selectPipelineDataset(id) {
  state.selectedPipelineDatasetId = id;
  renderPipeline();
}

function renderCurrentStageArtifactLink(ds) {
  const h = ds.stage_history.slice().reverse().find(x => x.to === ds.current_stage);
  if (h?.artifact_id) {
    return `<div style="margin-top:8px;"><a href="#" onclick="viewArtifact('${h.artifact_id}');return false;" style="font-family:var(--mono);font-size:12px;">View current-stage artifact: ${h.artifact_id} →</a></div>`;
  }
  return '';
}

function openStageArtifacts(soeId, stage) {
  const ds = state.datasets.find(d => d.id === soeId);
  const h = ds.stage_history.find(x => x.to === stage);
  if (h?.artifact_id) viewArtifact(h.artifact_id);
  else toast(`No artifact for stage "${STAGE_LABEL[stage]}" yet`);
}

// ===================================================================
// ADVANCE STAGE + ARTIFACT GENERATION
// ===================================================================
function confirmAdvance(soeId) {
  const ds = state.datasets.find(d => d.id === soeId);
  const next = nextStage(ds.current_stage, ds.ai_ml_authorized);
  if (!next) { toast('No further stages'); return; }
  const artifact = generateArtifactForTransition(ds, ds.current_stage, next);
  renderAdvanceModal(ds, next, artifact);
}

function renderAdvanceModal(ds, nextStg, artifact) {
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div>
            <div class="modal-title">Advance ${ds.id}: ${STAGE_LABEL[ds.current_stage]} → ${STAGE_LABEL[nextStg]}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">Artifact generated: <strong>${esc(artifact.__name)}</strong> · ${esc(artifact.id)}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          ${renderArtifactBody(artifact)}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="commitAdvance('${ds.id}', '${nextStg}', '${artifact.id}')">Sign off &amp; Advance</button>
        </div>
      </div>
    </div>`;
  $('#modal-root').innerHTML = html;
  window.__pendingArtifact = artifact;
}

function commitAdvance(soeId, nextStg, artifactId) {
  const ds = state.datasets.find(d => d.id === soeId);
  const prev = ds.current_stage;
  const artifact = window.__pendingArtifact;

  // Commit artifact to appropriate store
  persistArtifact(artifact);

  ds.stage_history.push({ from: prev, to: nextStg, timestamp: new Date().toISOString(), actor: 'Dr. James Liu', artifact_id: artifact.id });
  ds.current_stage = nextStg;
  ds.updated_at = new Date().toISOString();
  persist(STORAGE_KEYS.datasets, state.datasets);

  const layer = (nextStg === 'model_training' || nextStg === 'deployment') ? 'ai_sandbox' : 'data_plane';
  logEvent({ timestamp: new Date().toISOString(), soe_id: ds.id, dataset_name: ds.dataset_name, layer, event_type: 'stage_advanced', actor_name: 'Dr. James Liu', actor_role: 'BFI Data Steward', description: `Advanced ${ds.id} from ${STAGE_LABEL[prev]} → ${STAGE_LABEL[nextStg]}. Artifact: ${artifact.id}.`, artifact_id: artifact.id, metadata: { from: prev, to: nextStg } });

  closeModal();
  window.__pendingArtifact = null;
  renderAll();
  toast(`${ds.id} advanced → ${STAGE_LABEL[nextStg]}`);
}

function persistArtifact(artifact) {
  const t = artifact.__type;
  if (t === 'receipt') { state.receipts.push(artifact); persist(STORAGE_KEYS.receipts, state.receipts); }
  else if (t === 'validation') { state.validation.push(artifact); persist(STORAGE_KEYS.validation, state.validation); }
  else if (t === 'transformation') { artifact.__ops.forEach(o => state.transformation.push(o)); persist(STORAGE_KEYS.transformation, state.transformation); }
  else if (t === 'training') {
    state.training.push(artifact); persist(STORAGE_KEYS.training, state.training);
    // Also register a model
    const model = { id: artifact.model_id, name: artifact.model_purpose.slice(0, 60), purpose: artifact.model_purpose, architecture: artifact.architecture, training_method: artifact.training_method, linked_soe_ids: [artifact.soe_id], linked_tar_id: artifact.id, status: 'authorized', post_termination_plan: artifact.post_termination_plan, created_at: new Date().toISOString(), deployed_at: null, retired_at: null };
    state.models.push(model); persist(STORAGE_KEYS.models, state.models);
  }
}

function generateArtifactForTransition(ds, current, next) {
  // Gate between current and next; artifact reflects the current stage's output
  if (current === 'request') return genReceipt(ds);
  if (current === 'ingestion') return genValidation(ds);
  if (current === 'validation') return genTransformation(ds);
  if (current === 'cleaning') return genLabelingRecord(ds);
  if (current === 'labeling') return genStorageConfirmation(ds);
  if (current === 'storage') return genAccessList(ds);
  if (current === 'access') return genTrainingAuth(ds);
  if (current === 'model_training') return genDeploymentAuth(ds);
  return { id: 'GEN-' + Date.now(), __type: 'generic', __name: 'Artifact' };
}

function artifactSequence(prefix, soeId, existing) {
  const matches = existing.filter(x => x.id?.startsWith(`${soeId}-${prefix}`));
  return String(matches.length + 1).padStart(3, '0');
}

function genReceipt(ds) {
  const seq = artifactSequence('RCP', ds.id, state.receipts);
  return {
    __type: 'receipt', __name: 'Chain of Custody Receipt',
    id: `${ds.id}-RCP-${seq}`, soe_id: ds.id, file_hash: fakeHash(),
    file_size_bytes: Math.floor(ds.record_count * 120 + Math.random() * 5_000_000),
    transfer_method: ds.tier === 3 ? 'sftp' : 'https', transfer_type: 'initial',
    record_count: ds.record_count, schema_match: true,
    upload_timestamp: new Date().toISOString(),
    uploaded_by: ds.roles.data_custodian.name,
    verified_by: ds.roles.bfi_data_steward.name,
    privacy_countersign: ds.tier === 3 && ds.roles.security_official ? { name: ds.roles.security_official.name, timestamp: new Date().toISOString() } : null,
    disclosure_log_id: ds.tier === 3 ? `DLOG-${ds.id.replace('SOE-','')}-${seq}` : null,
    status: 'verified'
  };
}

function genValidation(ds) {
  const seq = artifactSequence('VAL', ds.id, state.validation);
  const drift = Math.random() > 0.5;
  return {
    __type: 'validation', __name: 'Validation Report',
    id: `${ds.id}-VAL-${seq}`, soe_id: ds.id, receipt_id: `${ds.id}-RCP-001`,
    schema_checks: [
      { column: 'record_id', declared_type: 'string', actual_type: 'string', status: 'match' },
      { column: 'reported_at', declared_type: 'datetime', actual_type: 'datetime', status: 'match' },
      { column: 'category', declared_type: 'enum', actual_type: drift ? 'enum+1' : 'enum', status: drift ? 'drift' : 'match' }
    ],
    record_count: { declared: ds.record_count, actual: ds.record_count - Math.floor(Math.random() * 200), delta_pct: -0.03 },
    temporal_coverage: { declared_start: ds.temporal_start, declared_end: ds.temporal_end || new Date().toISOString().split('T')[0], actual_start: ds.temporal_start, actual_end: ds.temporal_end || new Date().toISOString().split('T')[0], gaps: [] },
    null_prevalence: [{ column: 'optional_notes', pct: 1.2 }],
    duplicate_keys: 0, encoding_issues: [], undisclosed_pii_found: false, reclassification_triggered: false,
    divergence_notes: drift ? 'Minor enum drift detected; auto-accepted.' : 'Clean validation. No divergences.',
    steward_signoff: { name: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() },
    outcome: 'accepted', created_at: new Date().toISOString()
  };
}

function genTransformation(ds) {
  const base = ds.id.replace('SOE-', '');
  const ops = [
    { id: `XFM-${base}-01`, soe_id: ds.id, sequence: 1, op_type: 'standardize', target_columns: ['timestamp'], description: 'Standardize timezone to America/Chicago.', rows_affected: ds.record_count, before_sample: '2025-01-14T18:22:00Z', after_sample: '2025-01-14T12:22:00-06:00', reversible: true, operator: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() },
    { id: `XFM-${base}-02`, soe_id: ds.id, sequence: 2, op_type: 'deduplicate', target_columns: ['record_id'], description: 'Drop duplicate records retaining latest-updated.', rows_affected: Math.floor(ds.record_count * 0.002), before_sample: null, after_sample: null, reversible: false, operator: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() },
    { id: `XFM-${base}-03`, soe_id: ds.id, sequence: 3, op_type: 'impute', target_columns: ['optional_notes'], description: 'Impute 1.2% missing notes with empty-string sentinel.', rows_affected: Math.floor(ds.record_count * 0.012), before_sample: 'null', after_sample: '""', reversible: true, operator: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() }
  ];
  return {
    __type: 'transformation', __name: 'Transformation Log', __ops: ops,
    id: `${ds.id}-XFM-BATCH`, soe_id: ds.id, operator: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString()
  };
}

function genLabelingRecord(ds) {
  return { __type: 'labeling', __name: 'Label Verification Record', id: `${ds.id}-LBL-001`, soe_id: ds.id, label_count: Math.floor(ds.record_count * 0.1), iaa: 0.89, labeler: ds.roles.ai_system_operator?.name || ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString(), signoff: ds.roles.bfi_data_steward.name };
}

function genStorageConfirmation(ds) {
  const controls = getTierControls(ds.tier);
  return { __type: 'storage', __name: 'Storage Controls Confirmation', id: `${ds.id}-STR-001`, soe_id: ds.id, storage_tier: `Tier ${ds.tier}`, encryption: controls.storage, retention_term: ds.retention_term, disposition_schedule: controls.disposition, audit_retention: controls.audit, signoff: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() };
}

function genAccessList(ds) {
  return { __type: 'access', __name: 'Authorized User List', id: `${ds.id}-ACL-001`, soe_id: ds.id, users: ds.roles.authorized_users, disclosure_logging: ds.tier === 3, signoff: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() };
}

function genTrainingAuth(ds) {
  const seq = artifactSequence('TAR', ds.id, state.training);
  const modelId = `MDL-${ds.id.replace('SOE-','')}-${seq}`;
  return {
    __type: 'training', __name: 'Training Authorization Record',
    id: `${ds.id}-TAR-${seq}`, soe_id: ds.id, model_id: modelId,
    model_purpose: ds.authorized_purpose,
    architecture: 'Fine-tuned model (method to be specified by AI Operator)',
    training_method: 'fine_tune',
    environment: 'BFI AI Sandbox · Isolated GPU pool · Egress disabled',
    datasets_used: [{ soe_id: ds.id, tier: ds.tier, date_range: `${ds.temporal_start} to ${ds.temporal_end || 'ongoing'}`, record_count: ds.record_count }],
    memorization_safeguards: ['Deduplication prior to training', 'Membership-inference testing on held-out set', 'Verbatim generation sampling in pre-deploy eval'],
    pre_deploy_eval_criteria: ['Task-level accuracy threshold met', 'Bias delta <5% across protected attributes', 'Hallucination rate <2%'],
    deid_method: ds.tier === 3 ? 'k-anonymity (k=5) + geographic aggregation' : null,
    reid_risk_assessment_id: ds.tier === 3 ? `RIA-${ds.id}-001` : null,
    residual_risk: ds.tier === 3 ? 'low' : null,
    post_termination_plan: '(a) Model continues with documented training provenance; artifacts archived.',
    steward_signoff: { name: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() },
    ai_operator_signoff: ds.roles.ai_system_operator ? { name: ds.roles.ai_system_operator.name, timestamp: new Date().toISOString() } : null,
    privacy_official_signoff: ds.tier === 3 && ds.roles.security_official ? { name: ds.roles.security_official.name, timestamp: new Date().toISOString() } : null,
    authorized_at: new Date().toISOString(),
    status: 'authorized'
  };
}

function genDeploymentAuth(ds) {
  return { __type: 'deployment', __name: 'Deployment Authorization', id: `${ds.id}-DEP-001`, soe_id: ds.id, monitoring_plan: 'Weekly drift monitoring; monthly bias audit; incident reporting < 24 hours.', deployment_env: 'BFI Production (human-in-the-loop)', signoff: ds.roles.bfi_data_steward.name, timestamp: new Date().toISOString() };
}

function viewArtifact(artifactId) {
  const a = findArtifact(artifactId);
  if (!a) { toast('Artifact not found'); return; }
  renderArtifactModal(a);
}

function findArtifact(id) {
  return state.receipts.find(x => x.id === id)
    || state.validation.find(x => x.id === id)
    || state.training.find(x => x.id === id)
    || state.amendments.find(x => x.id === id)
    || state.classification.find(x => x.thread_id === id)
    || null;
}

function renderArtifactModal(a) {
  const type = a.__type || inferArtifactType(a);
  const name = a.__name || inferArtifactName(a);
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div>
            <div class="modal-title">${esc(name)}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;font-family:var(--mono);">${esc(a.id || a.thread_id)}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">${renderArtifactBodyByType(a, type)}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost btn-sm" onclick='toast("Mock export — JSON copied to clipboard")'>Download JSON</button>
          <button class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
  $('#modal-root').innerHTML = html;
}

function inferArtifactType(a) {
  if (a.file_hash !== undefined) return 'receipt';
  if (a.schema_checks !== undefined) return 'validation';
  if (a.model_id !== undefined) return 'training';
  if (a.amendment_number !== undefined) return 'amendment';
  if (a.thread_id !== undefined) return 'classification';
  return 'generic';
}

function inferArtifactName(a) {
  return { receipt: 'Chain of Custody Receipt', validation: 'Validation Report', training: 'Training Authorization Record', amendment: 'Amendment', classification: 'Classification Thread' }[inferArtifactType(a)] || 'Artifact';
}

function renderArtifactBody(a) { return renderArtifactBodyByType(a, a.__type); }

function renderArtifactBodyByType(a, type) {
  if (type === 'receipt') return renderReceiptArtifact(a);
  if (type === 'validation') return renderValidationArtifact(a);
  if (type === 'transformation') return renderTransformationArtifact(a);
  if (type === 'training') return renderTrainingArtifact(a);
  if (type === 'labeling') return renderLabelingArtifact(a);
  if (type === 'storage') return renderStorageArtifact(a);
  if (type === 'access') return renderAccessArtifact(a);
  if (type === 'deployment') return renderDeploymentArtifact(a);
  if (type === 'amendment') return renderAmendmentArtifact(a);
  return `<pre style="font-family:var(--mono);font-size:11px;background:#f9fafb;padding:12px;border-radius:var(--radius);overflow:auto;">${esc(JSON.stringify(a, null, 2))}</pre>`;
}

    <div class="report-section">

      <div class="detail-grid">
        <div><div class="detail-field-label">De-identification Method</div><div class="detail-field-value">${esc(t.deid_method)}</div></div>
        <div><div class="detail-field-label">Re-ID Risk Assessment</div><div class="detail-field-value mono">${esc(t.reid_risk_assessment_id)}</div></div>
        <div><div class="detail-field-label">Residual Risk</div><div class="detail-field-value"><span class="badge badge-${t.residual_risk === 'low' ? 'green' : t.residual_risk === 'medium' ? 'amber' : 'red'}">${esc(t.residual_risk)}</span></div></div>
      </div>
    </div>` : ''}

    <div class="report-section">
      <div class="report-section-title">Post-Termination Plan</div>
      <div style="font-size:13px;">${esc(t.post_termination_plan)}</div>
    </div>

    <div class="report-section">
      <div class="report-section-title">Sign-offs</div>
      <div class="signoff-grid">
        <div class="signoff-box"><div class="signoff-role">BFI Data Steward</div><div class="signoff-name">${esc(t.steward_signoff?.name || '—')}</div><div class="signoff-ts">${t.steward_signoff ? fmtDateTime(t.steward_signoff.timestamp) : '<span class="signoff-missing">Not yet signed</span>'}</div></div>
        <div class="signoff-box"><div class="signoff-role">AI System Operator</div><div class="signoff-name">${esc(t.ai_operator_signoff?.name || '—')}</div><div class="signoff-ts">${t.ai_operator_signoff ? fmtDateTime(t.ai_operator_signoff.timestamp) : '<span class="signoff-missing">Not yet signed</span>'}</div></div>
        ${t.privacy_official_signoff !== undefined ? `<div class="signoff-box required-t3"><div class="signoff-role">Info Security & Privacy Official <span style="color:var(--warning);">T3 Required</span></div><div class="signoff-name">${esc(t.privacy_official_signoff?.name || '—')}</div><div class="signoff-ts">${t.privacy_official_signoff ? fmtDateTime(t.privacy_official_signoff.timestamp) : '<span class="signoff-missing">Not yet signed</span>'}</div></div>` : ''}
      </div>
    </div>`;
}

function renderLabelingArtifact(l) {
  return `<div class="detail-grid">
    <div><div class="detail-field-label">Labels Applied</div><div class="detail-field-value">${fmtNumber(l.label_count)}</div></div>
    <div><div class="detail-field-label">Inter-Annotator Agreement</div><div class="detail-field-value">${l.iaa}</div></div>
    <div><div class="detail-field-label">Labeler</div><div class="detail-field-value">${esc(l.labeler)}</div></div>
    <div><div class="detail-field-label">Sign-off</div><div class="detail-field-value">${esc(l.signoff)}</div></div>
  </div>`;
}

function renderStorageArtifact(s) {
  return `<div class="detail-grid">
    <div><div class="detail-field-label">Storage Tier</div><div class="detail-field-value">${esc(s.storage_tier)}</div></div>
    <div><div class="detail-field-label">Retention Term</div><div class="detail-field-value">${esc(s.retention_term)}</div></div>
    <div class="span-2"><div class="detail-field-label">Encryption</div><div class="detail-field-value">${esc(s.encryption)}</div></div>
    <div class="span-2"><div class="detail-field-label">Disposition Schedule</div><div class="detail-field-value">${esc(s.disposition_schedule)}</div></div>
    <div class="span-2"><div class="detail-field-label">Audit Retention</div><div class="detail-field-value">${esc(s.audit_retention)}</div></div>
    <div><div class="detail-field-label">Sign-off</div><div class="detail-field-value">${esc(s.signoff)}</div></div>
    <div><div class="detail-field-label">Timestamp</div><div class="detail-field-value mono">${fmtDateTime(s.timestamp)}</div></div>
  </div>`;
}

function renderAccessArtifact(a) {
  return `<div class="report-section">
    <div class="report-section-title">Authorized Users</div>
    <div>${(a.users || []).map(u => `<span class="badge badge-gray" style="margin-right:6px;margin-bottom:6px;display:inline-block;">${esc(u)}</span>`).join('') || 'None'}</div>
  </div>
  <div class="callout ${a.disclosure_logging ? 'callout-danger' : 'callout-info'}"><span class="callout-label">${a.disclosure_logging ? 'TIER 3 CONTROL' : 'ACCESS CONTROL'}</span>${a.disclosure_logging ? 'Disclosure log entry required for every access. Each access writes to thread_disclosure_logs with user, timestamp, and access purpose.' : 'Standard access logging applies. Session logs retained per audit policy.'}</div>`;
}

function renderDeploymentArtifact(d) {
  return `<div class="detail-grid">
    <div class="span-2"><div class="detail-field-label">Deployment Environment</div><div class="detail-field-value">${esc(d.deployment_env)}</div></div>
    <div class="span-2"><div class="detail-field-label">Monitoring Plan</div><div class="detail-field-value">${esc(d.monitoring_plan)}</div></div>
    <div><div class="detail-field-label">Sign-off</div><div class="detail-field-value">${esc(d.signoff)}</div></div>
    <div><div class="detail-field-label">Timestamp</div><div class="detail-field-value mono">${fmtDateTime(d.timestamp)}</div></div>
  </div>`;
}

function renderAmendmentArtifact(a) {
  return `<div class="detail-grid">
    <div><div class="detail-field-label">Amendment #</div><div class="detail-field-value">${a.amendment_number}</div></div>
    <div><div class="detail-field-label">Status</div><div class="detail-field-value"><span class="badge badge-${a.status === 'executed' ? 'green' : a.status === 'pending' ? 'amber' : 'red'}">${esc(a.status)}</span></div></div>
    <div class="span-2"><div class="detail-field-label">Title</div><div class="detail-field-value"><strong>${esc(a.title)}</strong></div></div>
    <div class="span-2"><div class="detail-field-label">Initiated By</div><div class="detail-field-value">${esc(a.initiated_by.name)} — ${esc(a.initiated_by.role)}, ${esc(a.initiated_by.party)}</div></div>
    <div class="span-2"><div class="detail-field-label">Sections Affected</div><div class="detail-field-value">${a.sections_affected.join(', ')}</div></div>
    <div class="span-2"><div class="detail-field-label">Rationale</div><div class="detail-field-value">${esc(a.rationale)}</div></div>
    <div class="span-2"><div class="detail-field-label">Change</div><div class="detail-field-value"><div style="font-family:var(--mono);font-size:11px;padding:8px;background:#f9fafb;border-radius:4px;"><span class="diff-old">${esc(a.old_text)}</span><br><span class="diff-new">${esc(a.new_text)}</span></div></div></div>
  </div>`;
}
</script>

<script>
// ===================================================================
// INGESTION VIEW — pre-transfer onboarding tracker
// ===================================================================
const WIZARD_STEPS = [
  { key: 'agency_info', label: 'Agency Info' },
  { key: 'dataset_details', label: 'Dataset' },
  { key: 'classification', label: 'Classification' },
  { key: 'scope_of_exchange', label: 'SOE' },
  { key: 'signatures', label: 'Signatures' },
  { key: 'data_transfer', label: 'Transfer' }
];

function getOnboardingProgress(ds) {
  // Read from thread_onboarding_progress keyed by soe_id; fallback to derive from dataset record
  let all = [];
  try { all = JSON.parse(localStorage.getItem('thread_onboarding_progress') || '[]'); } catch {}
  const byId = all.find(p => p.soe_id === ds.id);
  if (byId) return byId;
  // Derive
  const status = getSoeStatus(ds);
  const signatures = ds.signatures || { bfi_steward: null, bfi_security_official: null, agency_data_owner: null, agency_custodian: null };
  const anySig = Object.values(signatures).some(v => v && v.timestamp);
  const allRequired = !!signatures.bfi_steward && !!signatures.agency_data_owner && (ds.tier < 2 || !!signatures.bfi_security_official);
  const steps = ['agency_info', 'dataset_details', 'classification'];
  if (status !== 'draft' || ds.authorized_purpose) steps.push('scope_of_exchange');
  if (anySig) steps.push('signatures');
  if (ds.transfer_status === 'verified') steps.push('data_transfer');
  let curStep = 'agency_info';
  if (!steps.includes('dataset_details')) curStep = 'dataset_details';
  else if (!steps.includes('classification')) curStep = 'classification';
  else if (!steps.includes('scope_of_exchange')) curStep = 'scope_of_exchange';
  else if (!steps.includes('signatures')) curStep = 'signatures';
  else if (!steps.includes('data_transfer')) curStep = 'data_transfer';
  return {
    soe_id: ds.id,
    wizard_steps_completed: steps,
    wizard_current_step: curStep,
    soe_status: status,
    signatures,
    transfer_status: ds.transfer_status || (status === 'executed' ? 'awaiting_upload' : 'not_started'),
    transfer_metadata: ds.transfer_metadata || null
  };
}

function renderIngestion() {
  const rows = state.datasets.filter(isIngesting);
  let selected = rows.find(d => d.id === state.selectedIngestionId) || rows[0];
  if (selected) state.selectedIngestionId = selected.id;

  const html = `
    <div class="view-header">
      <div>
        <div class="view-title">Ingestion</div>
        <div class="view-subtitle">Pre-transfer onboarding · ${rows.length} dataset${rows.length !== 1 ? 's' : ''} awaiting executed SOE or data transfer</div>
      </div>
    </div>

    ${rows.length === 0 ? `
      <div class="card"><div style="text-align:center;padding:48px 20px;color:var(--text-secondary);">
        <div style="font-size:36px;margin-bottom:10px;">✓</div>
        <div style="font-weight:600;color:var(--text-primary);margin-bottom:6px;">No datasets currently in ingestion</div>
        <div style="font-size:13px;">New agency submissions will appear here until the SOE is executed and data transfer is verified.</div>
      </div></div>
    ` : `
      <div class="ingestion-grid">
        <div class="ing-list">
          <div class="ing-list-head"><span>In Progress</span><span class="badge badge-blue" style="font-size:10px;">${rows.length}</span></div>
          ${rows.map(d => renderIngestionCard(d, d.id === state.selectedIngestionId)).join('')}
        </div>
        <div class="ing-detail-stack">
          ${selected ? renderIngestionDetail(selected) : ''}
        </div>
      </div>
    `}
  `;
  $('#view-ingestion').innerHTML = html;
}

function renderIngestionCard(ds, isSelected) {
  const prog = getOnboardingProgress(ds);
  const completedIdx = WIZARD_STEPS.findIndex(s => s.key === prog.wizard_current_step);
  const tierBadgeHtml = ds.tier ? tierBadgeShort(ds.tier) : '<span class="badge badge-amber" style="font-size:10px;">Pending</span>';
  return `
    <div class="ing-card ${isSelected ? 'selected' : ''}" onclick="selectIngestion('${ds.id}')">
      <div class="ing-card-name">${esc(ds.dataset_name)}</div>
      <div class="ing-card-agency">${esc(ds.agency_name || '—')}${ds.agency_department ? ' · ' + esc(ds.agency_department) : ''}</div>
      <div class="ing-card-row">
        <span class="ing-card-soe">${ds.id}</span>
        ${tierBadgeHtml}
        <span class="soe-status-badge ${prog.soe_status}" style="font-size:9px;padding:2px 7px;">${soeStatusLabel(prog.soe_status)}</span>
        <span class="ing-card-time">${relTime(ds.created_at)}</span>
      </div>
      <div class="ing-progress" title="Onboarding progress">
        ${WIZARD_STEPS.map((s, i) => {
          const done = prog.wizard_steps_completed.includes(s.key);
          const active = s.key === prog.wizard_current_step;
          return `<div class="ing-progress-dot ${done ? 'done' : active ? 'active' : ''}" title="${s.label}"></div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function selectIngestion(soeId) {
  state.selectedIngestionId = soeId;
  renderIngestion();
}

function renderIngestionDetail(ds) {
  return `
    ${renderIngestionClassificationChat(ds)}
    ${renderIngestionSoeDraft(ds)}
    ${renderIngestionSignatures(ds)}
    ${renderIngestionTransfer(ds)}
  `;
}

function renderIngestionClassificationChat(ds, opts = {}) {
  const thread = bfiGetOrCreateThread(ds);
  const readOnly = !!opts.readOnly;
  const status = thread.classification_status || 'pending';
  const proceedEnabled = status === 'agreed' || status === 'finalized';
  const proposeOpen = !!state._classifyProposeOpen;
  const sumTier = thread.agreed_tier || thread.final_tier || (thread.agency_override_tier) || thread.auto_suggested_tier || ds.tier;
  const statusSentence = (() => {
    switch (status) {
      case 'system_suggested': return `Portal suggested Tier ${thread.auto_suggested_tier || '—'}. Awaiting agency response.`;
      case 'agency_accepted': return 'Agency accepted system suggestion.';
      case 'agency_overrode': return `Agency overrode system suggestion of Tier ${thread.auto_suggested_tier || '—'} to Tier ${thread.agency_override_tier || '—'}.` + (thread.agency_override_rationale ? ` Rationale: "${thread.agency_override_rationale}"` : '');
      case 'bfi_proposed': return 'BFI proposed a classification — awaiting agency response.';
      case 'disputed': return `Classification disputed — round ${thread.dispute_count || 1}.`;
      case 'agreed': return `Classification agreed — Tier ${thread.agreed_tier}.`;
      case 'finalized': return `Agency exercised final determination — Tier ${thread.final_tier}.`;
      default: return 'Classification pending.';
    }
  })();

  // Detect the most recent unresolved agency proposal that BFI can act on
  const lastAgencyProposal = [...(thread.messages || [])].reverse().find(m => {
    const n = normalizeThreadMessage(m);
    return n.party === 'agency' && n.proposedTier;
  });
  const bfiCanActOnAgencyProposal = ['agency_overrode', 'agency_accepted'].includes(status) && !readOnly;
  const bfiCanActOnPendingAgency = lastAgencyProposal && bfiCanActOnAgencyProposal;

  const disputeBanner = (status === 'disputed' && (thread.dispute_count || 0) >= 3) ? `
    <div class="callout callout-warning" style="margin:10px 0;">Dispute threshold reached. Per protocol, the agency may exercise final determination. BFI cannot override.</div>` : '';

  const d = ds;
  const summary = `
    <div class="ing-section-card" style="height:100%;">
      <div class="ing-section-head">
        <div class="ing-section-title">Submission Summary</div>
      </div>
      <div class="ing-section-body" style="font-size:13px;">
        <h3 style="margin:0 0 6px 0;font-size:16px;">${esc(d.dataset_name || 'Untitled Dataset')}</h3>
        <div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          ${sumTier ? tierBadge(sumTier) : '<span class="badge badge-gray">Tier pending</span>'}
          ${bfiClassificationStatusBadge(status)}
        </div>
        <div style="margin-bottom:12px;font-size:12px;color:var(--text-secondary);">${esc(statusSentence)}</div>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;margin:0;">
          <dt style="color:var(--text-secondary);">Agency</dt><dd style="margin:0;">${esc(d.agency_name || '—')}</dd>
          <dt style="color:var(--text-secondary);">Contact</dt><dd style="margin:0;">${esc(d.agency_primary_name || '—')}${d.agency_primary_title ? ` (${esc(d.agency_primary_title)})` : ''}</dd>
          <dt style="color:var(--text-secondary);">Description</dt><dd style="margin:0;">${esc(d.description || '—')}</dd>
          <dt style="color:var(--text-secondary);">Domains</dt><dd style="margin:0;">${(d.data_domains || []).map(esc).join(', ') || '—'}</dd>
          <dt style="color:var(--text-secondary);">Geo Scope</dt><dd style="margin:0;">${esc(d.geographic_scope || '—')}</dd>
          <dt style="color:var(--text-secondary);">Temporal</dt><dd style="margin:0;">${esc(d.temporal_coverage || '—')}</dd>
          <dt style="color:var(--text-secondary);">Records</dt><dd style="margin:0;">${esc(d.record_count || '—')}</dd>
          <dt style="color:var(--text-secondary);">Update Freq</dt><dd style="margin:0;">${esc(d.update_frequency || '—')}</dd>
          <dt style="color:var(--text-secondary);">Format</dt><dd style="margin:0;">${(d.file_formats || []).map(esc).join(', ') || '—'}</dd>
          <dt style="color:var(--text-secondary);">Published</dt><dd style="margin:0;">${d.published_on_open_data ? 'Yes' : 'No'}</dd>
          <dt style="color:var(--text-secondary);">PIA Redaction</dt><dd style="margin:0;">${d.requires_pia_redaction ? 'Yes' : 'No'}</dd>
          <dt style="color:var(--text-secondary);">Federal</dt><dd style="margin:0;">${(d.federal_regimes || []).map(r => String(r).toUpperCase()).join(', ') || 'None'}</dd>
          <dt style="color:var(--text-secondary);">AI/ML</dt><dd style="margin:0;">${d.ai_ml_authorized ? 'Enabled' : 'Disabled'}</dd>
          ${d.ai_ml_authorized && d.ai_ml_use_case ? `<dt style="color:var(--text-secondary);">AI Use Case</dt><dd style="margin:0;">${esc(d.ai_ml_use_case)}</dd>` : ''}
        </dl>
      </div>
    </div>`;

  const proposeForm = proposeOpen && !readOnly ? `
    <div class="propose-form" style="margin:10px 0;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fafbff;">
      <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Propose Classification</div>
      <select id="bfi-cls-tier-${ds.id}" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:13px;">
        <option value="1">Tier 1: Public</option>
        <option value="2" selected>Tier 2: Internal Operational</option>
        <option value="3">Tier 3: Restricted</option>
      </select>
      <textarea id="bfi-cls-rationale-${ds.id}" rows="2" placeholder="Explain your proposed classification..." style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:8px;font-family:inherit;"></textarea>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm btn-primary" onclick="bfiSubmitProposal('${thread.thread_id}')">Submit</button>
        <button class="btn btn-sm btn-secondary" onclick="bfiToggleProposeForm('${thread.thread_id}')">Cancel</button>
      </div>
    </div>` : '';

  const compose = !readOnly ? `
    <div style="padding-top:10px;border-top:1px solid var(--border);">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px;color:var(--text-secondary);">
        <input type="checkbox" id="bfi-cls-private-${ds.id}"> Internal only — not visible to agency
      </label>
      <div style="display:flex;gap:6px;align-items:flex-end;">
        <textarea id="bfi-cls-msg-${ds.id}" rows="2" placeholder="Type a message..." style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;resize:vertical;"></textarea>
        <button class="btn btn-sm btn-primary" onclick="bfiPostClassificationComment('${thread.thread_id}')">Post</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;justify-content:space-between;align-items:center;">
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm btn-secondary" onclick="bfiToggleProposeForm('${thread.thread_id}')">${proposeOpen ? 'Close proposal form' : 'Propose Classification'}</button>
          <button class="btn btn-sm btn-ghost" onclick="bfiEscalateClassification('${thread.thread_id}')">Escalate</button>
        </div>
        <button class="btn btn-sm btn-primary" onclick="bfiProceedToSoe('${ds.id}')" ${proceedEnabled ? '' : 'disabled title="Classification must be resolved before proceeding"'}>Proceed to SOE Drafting →</button>
      </div>
    </div>` : `
    <div style="padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text-secondary);">Read-only historical thread.</div>`;

  const discussion = `
    <div class="ing-section-card" style="height:100%;display:flex;flex-direction:column;">
      <div class="ing-section-head">
        <div style="flex:1;">
          <div class="ing-section-title">A · Classification Discussion</div>
          <div class="ing-section-sub">Thread <span class="mono" style="font-family:var(--mono);">${thread.thread_id}</span> · ${bfiClassificationStatusBadge(status)}${thread.agreed_tier ? ' · ' + tierBadge(thread.agreed_tier) : ''}</div>
        </div>
        ${!readOnly ? `<button class="btn btn-sm btn-secondary" onclick="openClassificationModal('${ds.id}')">Open in modal →</button>` : ''}
      </div>
      <div class="ing-section-body" style="flex:1;display:flex;flex-direction:column;">
        ${disputeBanner}
        <div class="ing-chat-thread" style="flex:1;max-height:380px;overflow-y:auto;">
          ${(thread.messages || []).map((m, i) => {
            const isLastAgency = lastAgencyProposal && m === lastAgencyProposal;
            const showAccept = bfiCanActOnPendingAgency && isLastAgency;
            return renderThreadMessage(m, { showAcceptProposal: showAccept, threadId: thread.thread_id });
          }).join('')}
          ${status === 'bfi_proposed' ? `<div class="callout callout-info" style="margin-top:8px;font-size:12px;">Awaiting agency response to BFI's proposed classification.</div>` : ''}
        </div>
        ${proposeForm}
        ${compose}
      </div>
    </div>`;

  return `
    <div style="display:grid;grid-template-columns:minmax(260px, 36%) 1fr;gap:16px;align-items:stretch;">
      ${summary}
      ${discussion}
    </div>`;
}

// ---- BFI classification action handlers (Mod 8 + 9) ----
function _bfiThreadDs(thread) { return state.datasets.find(d => d.id === thread.soe_id); }

function bfiToggleProposeForm(threadId) {
  state._classifyProposeOpen = !state._classifyProposeOpen;
  renderIngestion();
}

function bfiSubmitProposal(threadId) {
  const thread = state.classification.find(t => t.thread_id === threadId);
  if (!thread) return;
  const tier = parseInt(document.getElementById(`bfi-cls-tier-${thread.soe_id}`)?.value);
  const rationale = (document.getElementById(`bfi-cls-rationale-${thread.soe_id}`)?.value || '').trim();
  if (!tier) { toast('Pick a tier'); return; }
  thread.messages.push({
    id: `MSG-${thread.soe_id}-${Date.now()}`,
    author: 'Dr. Sofia Reyes', role: 'BFI · Data Steward', roleLabel: 'Data Steward, BFI',
    party: 'bfi', body: `BFI proposes Tier ${tier}: ${tierName(tier)}. ${rationale}`,
    proposedTier: tier, isSystem: false, isPrivate: false,
    timestamp: new Date().toISOString()
  });
  thread.classification_status = 'bfi_proposed';
  state._classifyProposeOpen = false;
  bfiPersistClassificationThread(thread);
  const ds = _bfiThreadDs(thread);
  logEvent({ timestamp: new Date().toISOString(), soe_id: thread.soe_id, dataset_name: ds?.dataset_name, layer: 'control_plane', event_type: 'classification_bfi_proposal', actor_name: 'Dr. Sofia Reyes', actor_role: 'BFI Data Steward', description: `BFI proposed Tier ${tier}.`, artifact_id: thread.thread_id, metadata: {} });
  renderIngestion();
  toast(`Proposed Tier ${tier}`);
}

function bfiPostClassificationComment(threadId) {
  const thread = state.classification.find(t => t.thread_id === threadId);
  if (!thread) return;
  const text = (document.getElementById(`bfi-cls-msg-${thread.soe_id}`)?.value || '').trim();
  const isPrivate = !!document.getElementById(`bfi-cls-private-${thread.soe_id}`)?.checked;
  if (!text) { toast('Enter a message'); return; }
  thread.messages.push({
    id: `MSG-${thread.soe_id}-${Date.now()}`,
    author: 'Dr. Sofia Reyes', role: 'BFI · Data Steward', roleLabel: 'Data Steward, BFI',
    party: 'bfi', body: text, proposedTier: null, isSystem: false, isPrivate,
    timestamp: new Date().toISOString()
  });
  if (thread.classification_status === 'disputed') thread.dispute_count = (thread.dispute_count || 0) + 1;
  bfiPersistClassificationThread(thread);
  const ds = _bfiThreadDs(thread);
  logEvent({ timestamp: new Date().toISOString(), soe_id: thread.soe_id, dataset_name: ds?.dataset_name, layer: 'control_plane', event_type: 'classification_message', actor_name: 'Dr. Sofia Reyes', actor_role: 'BFI Data Steward', description: `Classification message posted${isPrivate ? ' (internal)' : ''}.`, artifact_id: thread.thread_id, metadata: { isPrivate } });
  renderIngestion();
}

function bfiAcceptAgencyClassification(threadId, tier) {
  const thread = state.classification.find(t => t.thread_id === threadId);
  if (!thread) return;
  thread.agreed_tier = tier;
  thread.final_tier = tier;
  thread.classification_status = 'agreed';
  thread.resolved_at = new Date().toISOString();
  thread.messages.push({
    id: `MSG-${thread.soe_id}-${Date.now()}`,
    author: 'System', role: 'Portal', roleLabel: 'System',
    party: 'system', body: `BFI accepted agency's classification of Tier ${tier}.`,
    proposedTier: tier, isSystem: true, isPrivate: false,
    timestamp: new Date().toISOString()
  });
  // Mirror to dataset record so UI updates
  const ds = _bfiThreadDs(thread);
  if (ds) { ds.tier = tier; persist(STORAGE_KEYS.datasets, state.datasets); }
  bfiPersistClassificationThread(thread);
  logEvent({ timestamp: new Date().toISOString(), soe_id: thread.soe_id, dataset_name: ds?.dataset_name, layer: 'control_plane', event_type: 'classification_agreed', actor_name: 'Dr. Sofia Reyes', actor_role: 'BFI Data Steward', description: `Classification agreed at Tier ${tier}.`, artifact_id: thread.thread_id, metadata: {} });
  renderIngestion();
  toast(`Agreed at Tier ${tier}`);
}

function bfiEscalateClassification(threadId) {
  const thread = state.classification.find(t => t.thread_id === threadId);
  if (!thread) return;
  thread.messages.push({
    id: `MSG-${thread.soe_id}-${Date.now()}`,
    author: 'System', role: 'Portal', roleLabel: 'System',
    party: 'system', body: 'Escalated to senior reviewer.',
    proposedTier: null, isSystem: true, isPrivate: false,
    timestamp: new Date().toISOString()
  });
  bfiPersistClassificationThread(thread);
  renderIngestion();
  toast('Escalated');
}

function bfiProceedToSoe(soeId) {
  const prog = getOnboardingProgress(soeId);
  if (prog) {
    if (!prog.wizard_steps_completed.includes('classification')) prog.wizard_steps_completed.push('classification');
    prog.wizard_current_step = 'scope_of_exchange';
    persist(STORAGE_KEYS.onboarding, state.onboarding || (state.onboarding = []));
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_KEYS.onboarding) || '[]');
      const idx = all.findIndex(p => p.soe_id === soeId);
      if (idx >= 0) all[idx] = prog; else all.push(prog);
      localStorage.setItem(STORAGE_KEYS.onboarding, JSON.stringify(all));
    } catch (e) {}
  }
  openSoeModal(soeId);
}

// Legacy function kept for backward compatibility with other call sites
function postIngestionClassificationMessage(threadId) {
  bfiPostClassificationComment(threadId);
}

function renderIngestionSoeDraft(ds) {

          <div class="ing-section-sub">Status <span class="soe-status-badge ${status}" style="font-size:10px;">${soeStatusLabel(status)}</span>${hasAgencyEdits ? ' · <span class="badge badge-amber" style="font-size:10px;">Agency counter-edits pending</span>' : ''}</div>
        </div>

            <div class="detail-field-label">Retention · Breach Window</div>

        ${edits.length === 0 ? '<div style="font-size:12px;color:var(--text-secondary);padding:10px 0;">No edits recorded yet.</div>' : `

        <div style="margin-top:12px;display:flex;gap:8px;">

function renderIngestionSignatures(ds) {
  const sigs = ds.signatures || { bfi_steward: null, bfi_security_official: null, agency_data_owner: null, agency_custodian: null };
  const needsIsp = ds.tier >= 2;
  const requiredDone = !!sigs.bfi_steward && !!sigs.agency_data_owner && (!needsIsp || !!sigs.bfi_security_official);
  const sigLine = (label, sig, key, party) => {
    const signed = !!(sig && sig.timestamp);
    return `
      <div class="sig-line">
        <div class="sig-check ${signed ? 'signed' : ''}">${signed ? '✓' : ''}</div>
        <div>
          <div class="sig-role">${label}</div>
          <div class="sig-name">${signed ? esc(sig.name) : 'Awaiting'}</div>
          <div class="sig-time">${signed ? fmtDate(sig.timestamp) : '—'}</div>
          ${!signed && party === 'bfi' ? `<div class="sig-action"><button class="btn btn-secondary btn-sm" onclick="signBfiRole('${ds.id}','${key}')" style="font-size:11px;padding:3px 10px;">Sign</button></div>` : ''}
        </div>
      </div>`;
  };
  return `
    <div class="ing-section-card">
      <div class="ing-section-head">
        <div style="flex:1;">
          <div class="ing-section-title">C · Signature Status</div>
          <div class="ing-section-sub">${requiredDone ? '<span class="badge badge-green">All required signatures collected</span>' : '<span class="badge badge-amber">Awaiting signatures</span>'}</div>
        </div>
      </div>
      <div class="ing-section-body">
        <div class="sig-grid">
          <div>
            <div class="sig-col-head">BFI Side</div>
            ${sigLine('BFI Data Steward', sigs.bfi_steward, 'bfi_steward', 'bfi')}
            ${needsIsp ? sigLine('BFI ISP Official (Tier ' + ds.tier + ')', sigs.bfi_security_official, 'bfi_security_official', 'bfi') : ''}
          </div>
          <div>
            <div class="sig-col-head">Agency Side</div>
            ${sigLine('Agency Data Owner', sigs.agency_data_owner, 'agency_data_owner', 'agency')}
            ${sigLine('Agency Data Custodian (optional)', sigs.agency_custodian, 'agency_custodian', 'agency')}
          </div>
        </div>
        ${requiredDone && getSoeStatus(ds) !== 'executed' ? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);text-align:right;">
            <button class="btn btn-primary" onclick="executeAgreement('${ds.id}')">Execute Agreement & Begin Transfer →</button>
          </div>` : ''}
      </div>
    </div>
  `;
}

function signBfiRole(soeId, roleKey) {
  const ds = state.datasets.find(d => d.id === soeId);
  if (!ds) return;
  ds.signatures = ds.signatures || { bfi_steward: null, bfi_security_official: null, agency_data_owner: null, agency_custodian: null };
  const signerName = roleKey === 'bfi_steward' ? 'Dr. James Liu' : 'Priya Rao';
  const signerRole = roleKey === 'bfi_steward' ? 'BFI Data Steward' : 'BFI Info Security & Privacy Official';
  ds.signatures[roleKey] = { name: signerName, timestamp: new Date().toISOString() };
  ds.updated_at = ds.signatures[roleKey].timestamp;
  persist(STORAGE_KEYS.datasets, state.datasets);
  logEvent({ timestamp: ds.signatures[roleKey].timestamp, soe_id: soeId, dataset_name: ds.dataset_name, layer: 'control_plane', event_type: 'soe_signature', actor_name: signerName, actor_role: signerRole, description: `${signerRole} signed SOE ${soeId}.`, artifact_id: null, metadata: { role: roleKey } });
  toast(`${signerRole} signature recorded`);
  renderIngestion();
}

function executeAgreement(soeId) {
  const ds = state.datasets.find(d => d.id === soeId);
  if (!ds) return;
  ds.soe_status = 'executed';
  ds.effective_date = new Date().toISOString();
  ds.transfer_status = ds.transfer_status || 'awaiting_upload';
  ds.updated_at = ds.effective_date;
  persist(STORAGE_KEYS.datasets, state.datasets);
  logEvent({ timestamp: ds.effective_date, soe_id: soeId, dataset_name: ds.dataset_name, layer: 'control_plane', event_type: 'soe_executed', actor_name: 'Dr. James Liu', actor_role: 'BFI Data Steward', description: `SOE ${soeId} executed. Awaiting agency upload to begin data transfer.`, artifact_id: null, metadata: {} });
  toast('Agreement executed');
  renderAll();
}

function renderIngestionTransfer(ds) {
  const status = ds.transfer_status || (getSoeStatus(ds) === 'executed' ? 'awaiting_upload' : 'not_started');
  const meta = ds.transfer_metadata || null;
  const soeExec = getSoeStatus(ds) === 'executed';
  const states = [
    { k: 'not_started', dot: '', label: 'Not Started', sub: 'SOE not yet executed', next: 'Collect remaining signatures to execute SOE.', actor: 'BFI + Agency' },
    { k: 'awaiting_upload', dot: 'amber', label: 'Awaiting Agency Upload', sub: 'SOE executed — agency can now initiate transfer via portal', next: 'Agency initiates upload from the Portal.', actor: 'Agency Data Custodian' },
    { k: 'in_progress', dot: 'blue', label: 'Transfer In Progress', sub: 'Agency upload active', next: 'Wait for transfer completion.', actor: 'System' },
    { k: 'complete', dot: 'amber', label: 'Transfer Complete — Verifying', sub: 'File received; BFI steward to verify and issue custody receipt', next: 'BFI verifies file hash and record count, then issues the Chain of Custody Receipt.', actor: 'BFI Data Steward' },
    { k: 'verified', dot: 'green', label: 'Verified', sub: 'Custody receipt issued — dataset ready to advance', next: 'Dataset moves to Catalogue + Pipeline.', actor: '—' }
  ];
  const current = states.find(s => s.k === status) || states[0];

  const method = ds.tier === 1 ? 'Presigned URL (Tier 1)' : ds.tier === 2 ? 'Standard transfer with session logging (Tier 2)' : 'MFA-authenticated SFTP session (Tier 3)';

  let actionHtml = '';
  if (status === 'awaiting_upload') {
    actionHtml = `<div style="margin-top:10px;font-size:12px;color:var(--text-secondary);">Awaiting agency to initiate upload from the Portal.</div>`;
  } else if (status === 'in_progress') {
    actionHtml = `<button class="btn btn-secondary btn-sm" onclick="markTransferComplete('${ds.id}')">Simulate: Transfer complete →</button>`;
  } else if (status === 'complete') {
    actionHtml = `<button class="btn btn-primary btn-sm" onclick="verifyTransfer('${ds.id}')">Verify & Issue Custody Receipt →</button>`;
  } else if (status === 'verified') {
    actionHtml = `<span class="badge badge-green">Dataset available in Catalogue + Pipeline</span>`;
  } else if (soeExec && status === 'not_started') {
    actionHtml = `<button class="btn btn-secondary btn-sm" onclick="simulateUploadStart('${ds.id}')">Simulate: Agency begins upload →</button>`;
  }

  return `
    <div class="ing-section-card">
      <div class="ing-section-head">
        <div style="flex:1;">
          <div class="ing-section-title">D · Data Transfer Status</div>
          <div class="ing-section-sub">Method · ${method}</div>
        </div>
      </div>
      <div class="ing-section-body">
        ${states.map(s => {
          const isCur = s.k === status;
          const passed = states.findIndex(x => x.k === status) >= states.findIndex(x => x.k === s.k);
          if (!isCur && !passed) return '';
          return `
            <div class="xfer-card" style="${isCur ? 'border-color:var(--secondary);background:#eff6ff;' : ''}">
              <div class="xfer-dot ${isCur ? s.dot : 'green'}"></div>
              <div>
                <div class="xfer-label">${s.label}${isCur ? ' <span style="font-weight:500;font-size:11px;color:var(--secondary);">← current</span>' : ' <span style="font-weight:500;font-size:11px;color:var(--success);">✓</span>'}</div>
                <div class="xfer-sub">${s.sub}</div>
              </div>
            </div>`;
        }).join('')}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
          <div style="font-size:12px;margin-bottom:6px;"><strong>Next step:</strong> ${current.next}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;"><strong>Who acts:</strong> ${current.actor}</div>
          ${meta && (status === 'complete' || status === 'verified') ? `
            <div class="xfer-meta">
              <div><span class="k">File hash:</span><span class="v">${esc(meta.file_hash || '—')}</span></div>
              <div><span class="k">File size:</span><span class="v">${meta.file_size_bytes ? (meta.file_size_bytes/1024/1024).toFixed(2) + ' MB' : '—'}</span></div>
              <div><span class="k">Record count:</span><span class="v">${fmtNumber(meta.record_count || 0)}</span></div>
              <div><span class="k">Received:</span><span class="v">${meta.upload_timestamp ? fmtDate(meta.upload_timestamp) : '—'}</span></div>
            </div>
          ` : ''}
          <div style="margin-top:10px;">${actionHtml}</div>
        </div>
      </div>
    </div>
  `;
}

function simulateUploadStart(soeId) {
  const ds = state.datasets.find(d => d.id === soeId);
  if (!ds) return;
  ds.transfer_status = 'in_progress';
  ds.updated_at = new Date().toISOString();
  persist(STORAGE_KEYS.datasets, state.datasets);
  logEvent({ timestamp: ds.updated_at, soe_id: soeId, dataset_name: ds.dataset_name, layer: 'data_plane', event_type: 'transfer_started', actor_name: ds.roles?.data_custodian?.name || 'Agency Custodian', actor_role: 'Agency Data Custodian', description: `Agency began upload for ${soeId}.`, artifact_id: null, metadata: {} });
  toast('Transfer in progress');
  renderIngestion();
}

function markTransferComplete(soeId) {
  const ds = state.datasets.find(d => d.id === soeId);
  if (!ds) return;
  ds.transfer_status = 'complete';
  const hash = 'sha256:' + Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('') + '...';
  ds.transfer_metadata = {
    file_hash: hash,
    file_size_bytes: (ds.record_count || 100000) * 260,
    record_count: ds.record_count || 100000,
    upload_timestamp: new Date().toISOString()
  };
  ds.updated_at = ds.transfer_metadata.upload_timestamp;
  persist(STORAGE_KEYS.datasets, state.datasets);
  logEvent({ timestamp: ds.updated_at, soe_id: soeId, dataset_name: ds.dataset_name, layer: 'data_plane', event_type: 'transfer_complete', actor_name: 'System', actor_role: 'Transfer Service', description: `Transfer complete for ${soeId}. Awaiting BFI verification.`, artifact_id: null, metadata: ds.transfer_metadata });
  toast('Transfer complete — awaiting verification');
  renderIngestion();
}

function verifyTransfer(soeId) {
  const ds = state.datasets.find(d => d.id === soeId);
  if (!ds) return;
  ds.transfer_status = 'verified';
  ds.current_stage = ds.current_stage && ds.current_stage !== 'request' ? ds.current_stage : 'ingestion';
  ds.updated_at = new Date().toISOString();
  // Generate receipt via existing pipeline path if helper exists, else a minimal receipt
  try {
    if (typeof genReceipt === 'function') {
      const r = genReceipt(ds, ds.updated_at);
      state.receipts.unshift(r);
      persist(STORAGE_KEYS.receipts, state.receipts);
      ds.stage_history = ds.stage_history || [];
      ds.stage_history.push({ from: 'request', to: 'ingestion', timestamp: ds.updated_at, actor: 'Dr. James Liu', artifact_id: r.id });
    }
  } catch (e) {}
  persist(STORAGE_KEYS.datasets, state.datasets);
  logEvent({ timestamp: ds.updated_at, soe_id: soeId, dataset_name: ds.dataset_name, layer: 'control_plane', event_type: 'transfer_verified', actor_name: 'Dr. James Liu', actor_role: 'BFI Data Steward', description: `Custody receipt issued for ${soeId}. Dataset moves to Catalogue + Pipeline.`, artifact_id: null, metadata: {} });
  toast('Verified — dataset now in Catalogue + Pipeline');
  state.selectedIngestionId = null;
  renderAll();
}
</script>

function renderModelCard(m) {
  const linked = m.linked_soe_ids.map(id => state.datasets.find(d => d.id === id)).filter(Boolean);
  const tar = state.training.find(t => t.id === m.linked_tar_id);
  return `
    <div class="model-card" id="model-${m.id}">
      <div class="model-head">
        <span class="model-id">${esc(m.id)}</span>

      </div>
      <div class="model-meta"><strong>Purpose:</strong> ${esc(m.purpose)}</div>
      <div class="model-linked">${linked.map(d => `<span class="badge badge-gray">${d.id} ${tierBadgeShort(d.tier).replace('<span', '<span style="margin-left:4px"').replace('class="badge', 'class="badge badge-blue"')}</span>`).join('')}</div>
